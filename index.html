<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACK UI — 컴포넌트 테스트</title>
    <!--
      Pretendard **정적(static)** 빌드입니다. Figma 는 설치된 정적 글꼴을 쓰므로
      같은 조건이 됩니다 — Variable 은 400 을 보간으로 만들어 내서 힌팅이 달라지고,
      같은 Regular 인데 웹에서만 조금 다르게 보였습니다 (2026-08-12 교체).

      dynamic-subset 은 유지합니다. 한글 전체를 담은 정적 파일은 굵기당 1MB 가 넘어
      네 굵기만 써도 4MB 입니다 — 쓰는 글자만 내려받는 쪽이 맞습니다.
    -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
